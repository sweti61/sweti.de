<table class="w-100 collapse ba-0">
  <thead>
    {{ range .THead }}
      <tr class="bb b--black-10">
        {{ range . }}
          <th class="tl pv2 ph2 fw6">{{ .Text }}</th>
        {{ end }}
      </tr>
    {{ end }}
  </thead>
  <tbody>
    {{ range .TBody }}
      <tr class="bb b--black-10">
        {{ range . }}
          <td class="pv2 ph2">{{ .Text }}</td>
        {{ end }}
      </tr>
    {{ end }}
  </tbody>
</table>
